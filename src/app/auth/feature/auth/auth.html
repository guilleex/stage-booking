<app-loading />

<main class="auth-shell" [class.is-desktop]="isDesktop()" [class.is-mobile]="!isDesktop()">
    <section class="auth-card" aria-label="Authentication form">
        <div class="auth-showcase" aria-hidden="true">
            <img class="auth-logo auth-logo--desktop" src="logo.png" alt="VD System logo" />
            <span class="auth-showcase__line"></span>
        </div>

        <div class="auth-panel">
            <div class="auth-brand">
                <img class="auth-logo auth-logo--mobile" src="vd-system-logo-mobile.png" alt="VD System logo" />
                <h1>{{ 'LABEL.LOGIN' | translate }}</h1>
                <p>
                    {{ 'LABEL.NO_ACCOUNT' | translate }}
                    <button type="button" class="register-link" (click)="openRegistrationDialog()">
                        {{ 'LABEL.REGISTER' | translate }}
                    </button>
                </p>
            </div>

            <form class="auth-form" [formGroup]="form" (ngSubmit)="onSubmit()">
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>{{ 'LABEL.USERNAME' | translate }}</mat-label>
                    <mat-icon matPrefix>person_outline</mat-icon>
                    <input matInput formControlName="userName" required autocomplete="username" />
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>{{ 'LABEL.PASSWORD' | translate }}</mat-label>
                    <mat-icon matPrefix>key</mat-icon>
                    <input matInput type="password" formControlName="password" required autocomplete="current-password" />
                </mat-form-field>

                <button class="forgot-link" mat-button type="button" (click)="forgotPassword()">
                    {{ 'BUTTON.FORGOT_PASSWORD' | translate }}
                </button>

                <button class="login-button" mat-raised-button color="primary" type="submit" [disabled]="form.invalid">
                    <mat-icon>login</mat-icon>
                    {{ 'BUTTON.LOGIN' | translate }}
                </button>
            </form>
        </div>
    </section>
</main>
